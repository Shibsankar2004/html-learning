<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image tag</title>
    <style>
        body{
            background-color: #414141;
        }
    </style>
</head>
<body>
    <img src="https://images.pexels.com/photos/36613949/pexels-photo-36613949.jpeg"width="300px" alt="no image">
    <img src="./asd.jpg "width="300px" alt="no image">
    <picture>
        <source media="(min-width:670px)" srcset="./as.jpg">
        <source media="(min-width:690px)" srcset="./as.jpg">
        <img src="./asd.jpg" width="300px" alt="">
    </picture>
    <!-- an image map generator -->
     
<img src="ads.jpg" usemap="#image-map">

<map name="image-map">
    <area oneclick="one()" target="" alt="" title="" href="" coords="4223,3113,1584,2371" shape="rect">
     <area oneclick="two()" target="" alt="" title="" href="" coords="4223,3113,1584,2371" shape="rect">
</map>
<script>
    function one(){
        alert("you clicked on one")
    }
    function two(){
        alert("you clicked on two")
    }
    
</script>

    
</body>
</html>
