<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table{
            
            border-collapse: collapse; 
            text-align: center;
            color:black;
        }
        th,td{
            border: 1px solid black;
            padding: 10px;
        }
        tr:nth-child(even){
            background-color: #313131c3;
        }
    </style>
</head>
<body>
    <table style="width:100%;">
        <colgroup>
            <col span="2" style="background-color: blue;"/>
        </colgroup>
        <tr>
            <th>name</th>
            <th>rollnumber</th>
            <th>reg no</th>
        </tr>
        <tr>
            <td>shib</td>
            <td>12345</td>
            <td>09876</td>
        </tr>
        <tr>
            <td>bhim</td>
            <td>15677</td>
            <td>65467</td>
        </tr>
        <tr>
            <td>mina</td>
            <td>12467</td>
            <td>97655</td>
        </tr>
        <tr>
            <td>sankar</td>
            <td>123465</td>
            <td>09876789</td>
        </tr>
    </table>
    <br/>

    <table>
        <tr>
            <th >country</th>
            <td>india</td>
            <td>japan</td>
            
        </tr>
        <tr>
            <th>code</th>
            <td>in</td>
            <td>jp</td>
            
        </tr>
    </table>
    
</body>
</html>
